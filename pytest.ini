[pytest]
testpaths = tests
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
markers =
    unit: Pure unit tests – no DB/LLM/EDA tool required
    integration: Tests that require live services (DB, LLM)
    api: FastAPI TestClient tests
    slow: Long-running tests
    llm: Tests that make real LLM API calls (require MINIMAX_API_KEY)
